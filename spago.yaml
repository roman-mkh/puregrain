package:
  name: puregrain
  description: "Error-diffusion and ordered (Bayer) dithering for PureScript:
    Floyd-Steinberg, Atkinson, JJN and custom kernels, retro palettes; in
    memory, streaming or row by row."
  publish:
    version: 0.2.0
    license: MIT
    location:
      githubOwner: roman-mkh
      githubRepo: puregrain
  dependencies:
    - arrays: ">=7.3.1 <8.0.0"
    - catenable-lists: ">=7.0.1 <8.0.0"
    - either: ">=6.1.1 <7.0.0"
    - foldable-traversable: ">=6.0.1 <7.0.0"
    - integers: ">=6.0.1 <7.0.0"
    - lazy: ">=6.0.1 <7.0.0"
    - lists: ">=7.0.1 <8.0.0"
    - maybe: ">=6.0.1 <7.0.0"
    - numbers: ">=9.0.2 <10.0.0"
    - partial: ">=4.0.1 <5.0.0"
    - prelude: ">=6.0.3 <7.0.0"
    - strings: ">=6.1.0 <7.0.0"
    - tuples: ">=7.0.1 <8.0.0"
    - unfoldable: ">=6.0.1 <7.0.0"
  test:
    main: Test.Main
    dependencies:
      - effect
      - exceptions
      - quickcheck
      - spec
      - spec-discovery
      - spec-quickcheck
      - st
      - strings
workspace:
  packageSet:
    registry: 81.9.0
