<svg xmlns="http://www.w3.org/2000/svg" width="760" height="480" viewBox="0 0 760 480" role="img" aria-labelledby="t d">
<title id="t">Dithering time vs. image size, by quantizer mode</title>
<desc id="d">Log-log line chart of median dithering time for 5 quantizer modes. From 256² to 1024² the times grow ×3.96 to ×4.20 per doubling of the side (×4 is proportional to the pixel count, the dashed O(N²) reference). Exact values are in the table next to this chart.</desc>
<style>
  svg {
    --surface: #fcfcfb; --ink: #0b0b0b; --ink-2: #52514e; --muted: #898781;
    --grid: #e1e0d9; --axis: #c3c2b7; --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100; --s5: #e87ba4;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    svg {
      --surface: #1a1a19; --ink: #ffffff; --ink-2: #c3c2b7; --muted: #898781;
      --grid: #2c2c2a; --axis: #383835; --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500; --s5: #d55181;
    }
  }
  .bg { fill: var(--surface); }
  .grid { stroke: var(--grid); stroke-width: 1; }
  .axis { stroke: var(--axis); stroke-width: 1; }
  .tick { fill: var(--ink-2); font-size: 11px; font-variant-numeric: tabular-nums; }
  .axis-title, .legend, .ref-label { fill: var(--ink-2); font-size: 12px; }
  .title { fill: var(--ink); font-size: 16px; font-weight: 600; }
  .subtitle { fill: var(--ink-2); font-size: 12px; }
  .reference { fill: none; stroke: var(--muted); stroke-width: 1.5; stroke-dasharray: 5 4; }
  .line { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
  .mark { stroke: var(--surface); stroke-width: 2; }
  .line.s1 { stroke: var(--s1); } .mark.s1 { fill: var(--s1); }
  .line.s2 { stroke: var(--s2); } .mark.s2 { fill: var(--s2); }
  .line.s3 { stroke: var(--s3); } .mark.s3 { fill: var(--s3); }
  .line.s4 { stroke: var(--s4); } .mark.s4 { fill: var(--s4); }
  .line.s5 { stroke: var(--s5); } .mark.s5 { fill: var(--s5); }
</style>
